apiVersion: v1
kind: Service

metadata:
  name: python-web-app-stateful
  namespace: python-web-app

spec:
  clusterIP: None

  selector:
    app: python-web-app-stateful

  ports:
    - port: 80
      targetPort: 8080

---

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: python-web-app-stateful
  namespace: python-web-app

spec:
  serviceName: python-web-app-stateful
  replicas: 2

  selector:
    matchLabels:
      app: python-web-app-stateful

  template:
    metadata:
      labels:
        app: python-web-app-stateful

    spec:
      containers:
        - name: python-web-app
          image: python-web-app:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: app-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: app-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: standard

        resources:
          requests:
            storage: 1Gi
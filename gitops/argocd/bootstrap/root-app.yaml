apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-applications
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sanyo123/kubernetes-platform-engineering.git
    targetRevision: main
    path: gitops/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true